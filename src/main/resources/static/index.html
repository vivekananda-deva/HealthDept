<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthBridge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="side offcanvas-lg offcanvas-start" id="side" tabindex="-1">
    <div class="brand"><i class="bi bi-heart-pulse-fill"></i><span>HealthBridge</span></div>
    <nav class="nav flex-column" id="nav">
      <a class="nav-link" href="#/dashboard"><i class="bi bi-grid-1x2"></i>Dashboard</a>
      <a class="nav-link" href="#/appointments"><i class="bi bi-calendar2-check"></i>Appointments</a>
      <a class="nav-link" href="#/patients"><i class="bi bi-person-lines-fill"></i>Patients</a>
      <a class="nav-link" href="#/doctors"><i class="bi bi-person-badge"></i>Doctors</a>
      <a class="nav-link" href="#/hospitals"><i class="bi bi-hospital"></i>Hospitals</a>
    </nav>
    <div class="side-foot">
      <a class="nav-link" href="/swagger-ui/index.html" target="_blank" rel="noopener"><i class="bi bi-braces"></i>API docs</a>
      <button class="nav-link btn text-start w-100" id="theme"><i class="bi bi-moon-stars"></i><span>Dark mode</span></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar d-lg-none">
      <button class="btn btn-light" data-bs-toggle="offcanvas" data-bs-target="#side" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <strong>HealthBridge</strong>
    </header>
    <div id="view" class="view" aria-live="polite"></div>
  </main>
</div>

<div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="mTitle"></h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="mOk"></button></div>
  </div></div>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
